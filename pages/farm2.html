<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>Modern LINK Farm</title>

<style>
:root {
  --move-duration: 3s;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* 農場背景 */
body {
  background: url("https://images.unsplash.com/photo-1500382017468-9049fed747ef")
    center / cover no-repeat;
}

/* 動物通用 */
.animal {
  position: absolute;
  pointer-events: none;
  will-change: transform;
  transition: transform linear var(--move-duration);
}

/* 大戶光暈 */
.big {
  filter: drop-shadow(0 0 10px gold)
          drop-shadow(0 0 20px orange);
}
</style>
</head>

<body>
<div id="farm"></div>

<script>
/* === 基本設定 === */
const CONTRACT = "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"; // WETH
const APIKEY   = "VZGTN66MH2E76D5V5JU56YSI6JDWGYYPQF";

const ADDRESSES_CAT = [
  "0x04cef1586bc001835a7Cbf1f172A31B1Bb2E1b48"
];
const ADDRESSES_DOG = [
  "0x3ba148d6A8f4D9F243c495842E80542021401F8A"
];
const ADDRESSES_PIG = [
  "0x0c652f6507799894954A83BFEcA6cD113E3D5f34"
];

const ICONS = {
  cat: "https://cdn-icons-png.flaticon.com/512/616/616430.png",
  dog: "https://cdn-icons-png.flaticon.com/512/616/616408.png",
  pig: "https://cdn-icons-png.flaticon.com/512/616/616416.png"
};

const farm = document.getElementById("farm");
let animals = [];

/* === 建立動物 === */
function createAnimal(type, weth) {
  const img = document.createElement("img");
  img.className = "animal";
  img.src = ICONS[type];

  const size = Math.max(10, weth * 100);
  img.style.width  = size + "px";
  img.style.height = size + "px";

  if (weth >= 5) img.classList.add("big");

  farm.appendChild(img);
  animals.push(img);
}

/* === 隨機移動 === */
function animateAnimals() {
  animals.forEach(el => {
    const rect = el.getBoundingClientRect();
    const maxX = window.innerWidth  - rect.width;
    const maxY = window.innerHeight - rect.height;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    el.style.transform = `translate3d(${x}px, ${y}px, 0)`;
  });
}

setInterval(animateAnimals, 3000);

/* === 查詢 WETH === */
async function getBalance(address) {
  const url = `https://api.etherscan.io/v2/api?chainid=1` +
    `&module=account&action=tokenbalance` +
    `&contractaddress=${CONTRACT}` +
    `&address=${encodeURIComponent(address)}` +
    `&tag=latest&apikey=${APIKEY}`;

  try {
    const res  = await fetch(url);
    const json = await res.json();
    return json.status === "1" ? Number(json.result) / 1e18 : 0;
  } catch {
    return 0;
  }
}

/* === 載入農場 === */
async function loadFarm() {
  farm.innerHTML = "";
  animals = [];

  const cats = await Promise.all(
    ADDRESSES_CAT.map(getBalance)
  );
  cats.forEach(w => createAnimal("cat", w));

  const dogs = await Promise.all(
    ADDRESSES_DOG.map(getBalance)
  );
  dogs.forEach(w => createAnimal("dog", w));

  const pigs = await Promise.all(
    ADDRESSES_PIG.map(getBalance)
  );
  pigs.forEach(w => createAnimal("pig", w));
  
  animateAnimals();
}

/* 每 30 秒刷新 */
setInterval(loadFarm, 30_000);
loadFarm();
</script>
</body>
</html>
